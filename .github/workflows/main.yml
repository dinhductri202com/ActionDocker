name: Tailscale - Docker

on: 
  workflow_dispatch:
    inputs:
      link_iso:
        description: 'URL ISO'
        required: true
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: thông tin/cấu hình
        run: |
          echo "---OPEN-PORT---"
          echo "8006:8006/5900:5900"
          echo "3389:3389/tcp"
          echo "3389:3389/udp"
          echo "5900:5900/tcp"
          echo "-------RAM--------"
          free -h
          echo "-------CPU--------"
          lscpu
          echo "-------DISK-------"
          df -h
          echo "------DEV:/dev----"
          sudo ls /dev
          echo "--------END-------"
      - name: chuẩn bị phần mềm
        run: |
          sudo apt update -y
          sudo apt install wget curl -y
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up
      - name: cài win và khởi chạy
        run: |
          sudo chmod 666 /dev/kvm
          sudo mkdir /isos/
          sudo wget -O /isos/a.iso "${{ github.event.inputs.link_iso }}" &>/dev/null &
          while ps axg | grep -vw grep | grep -w wget > /dev/null; do sleep 1; done
          sudo wget -O /isos/driver.iso https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.240-1/virtio-win-0.1.240.iso &>/dev/null &
          while ps axg | grep -vw grep | grep -w wget > /dev/null; do sleep 1; done
          wget https://raw.githubusercontent.com/dinhductri202com/ActionDocker/main/compose.yaml
          tailscale ip -4
          echo "thanh cong, ket noi bang port 8006 o trinh duyet Chrome"
          sudo docker compose up
